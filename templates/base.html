{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flower Classifier{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<div class="container">
    <div class="topbar">
        <h1>Распознавание цветков</h1>
        <div class="auth-links">
            {% if user.is_authenticated %}
                <span class="username">Привет, {{ user.username }}!</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-secondary">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-secondary">Войти</a>
                <a href="{% url 'signup' %}" class="btn">Регистрация</a>
            {% endif %}
        </div>
    </div>
    {% block content %}{% endblock %}
</div>
</body>
</html>
